services:
  postgres-test:
    image: postgres:16-alpine
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: reservation_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d reservation_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  test-runner:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: builder
    command: npm run test
    env_file: .env.test
    environment:
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_NAME: reservation_test
      REDIS_URL: redis://redis-test:6379
      NODE_ENV: test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./sql:/app/sql
      - ./vitest.config.js:/app/vitest.config.js
      - ./*.lua:/app/
