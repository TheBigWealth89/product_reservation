services:
  # 1. API Server
  api-server:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: prs-api-server
    command: node --watch src/server.js
    restart: always
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - prs-network
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync
        - path: ./package.json
          action: rebuild

  # 2. Fulfill Order Worker
  fulfill-order-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: prs-fulfill-worker
    command: node --watch src/workers/fulfillOrderWorker.js
    restart: always
    stop_grace_period: 30s
    env_file:
      - .env
    networks:
      - prs-network
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync
        - path: ./package.json
          action: rebuild

  # 3. Expires Worker
  expires-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: prs-expires-worker
    command: node --watch src/workers/expiresWorker.js
    restart: always
    stop_grace_period: 30s
    env_file:
      - .env
    networks:
      - prs-network
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync
        - path: ./package.json
          action: rebuild

  # 4. Cleanup Worker
  cleanup-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: prs-cleanup-worker
    command: node --watch src/workers/cleanupWorker.js
    restart: always
    stop_grace_period: 30s
    env_file:
      - .env
    networks:
      - prs-network
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync
        - path: ./package.json
          action: rebuild

networks:
  prs-network:
    driver: bridge
